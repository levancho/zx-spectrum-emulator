<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZX Spectrum Classroom</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header>
  <h1>ZX Spectrum <span data-i18n="classroom">Classroom</span></h1>
  <div class="head-right">
    <button id="lang" title="Language / ენა">ქართული</button>
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
</header>

<main>
  <section class="machine">
    <div id="screen-wrap" tabindex="0">
      <canvas id="screen" width="320" height="240"></canvas>
      <div id="rom-missing" hidden>
        <p data-i18n="romMissing"></p>
        <input type="file" id="rom-files" multiple accept=".rom">
      </div>
    </div>
    <p id="focus-hint" data-i18n="hintOff"></p>
    <div class="toolbar">
      <label><span data-i18n="model">Model</span>
        <select id="model">
          <option value="48">48K</option>
          <option value="128">128K</option>
        </select>
      </label>
      <button id="reset" data-i18n="reset" data-i18n-title="resetTitle">Reset</button>
      <button id="break" data-i18n="break" data-i18n-title="breakTitle">Break</button>
      <button id="open-tap" data-i18n="insertTape">Insert tape…</button>
      <button id="save-tap" disabled data-i18n="downloadTape">Download saved tape</button>
      <label class="check"><input type="checkbox" id="sound" checked> <span data-i18n="sound">Sound</span></label>
      <input type="file" id="tap-file" accept=".tap" hidden>
    </div>
    <details id="kbd-details" open>
      <summary data-i18n="keyboard">Spectrum keyboard</summary>
      <div id="keyboard"></div>
      <p class="note" data-i18n="kbdNote"></p>
    </details>
  </section>

  <section class="editor">
    <div class="tabs" role="tablist">
      <button id="tab-program" role="tab" aria-selected="true" data-i18n="tabProgram">Program</button>
      <button id="tab-learn" role="tab" aria-selected="false" data-i18n="tabLearn">Learn BASIC</button>
    </div>

    <div id="panel-program" class="panel">
      <div class="toolbar">
        <button id="run" class="primary" data-i18n="run" data-i18n-title="runTitle">▶ Run</button>
        <select id="examples"></select>
        <button id="open-bas" data-i18n="open">Open…</button>
        <button id="save-bas" data-i18n="save">Save</button>
        <input type="file" id="bas-file" accept=".bas,.txt" hidden>
      </div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <label class="check below"><input type="checkbox" id="show-listing" checked> <span data-i18n="showListing"></span></label>
      <p class="note" data-i18n="editorNote"></p>
    </div>

    <div id="panel-learn" class="panel" hidden>
      <div class="toolbar">
        <button id="lesson-prev" data-i18n="prev">← Previous</button>
        <select id="lesson-select"></select>
        <button id="lesson-next" data-i18n="next">Next →</button>
      </div>
      <article>
        <h3 id="lesson-title"></h3>
        <div id="lesson-text"></div>
        <label class="check"><input type="checkbox" id="explain-on" checked> <span data-i18n="explainToggle"></span></label>
        <div id="lesson-code"></div>
        <p id="explain" aria-live="polite"></p>
        <button id="lesson-try" class="primary" data-i18n="tryIt">▶ Try it: run this program</button>
      </article>
    </div>

    <p id="message-row"><span id="message" role="status"></span> <button id="restore" hidden data-i18n="restore">Bring back my program</button></p>
  </section>
</main>

<script type="module" src="js/main.js?v=4"></script>
</body>
</html>
